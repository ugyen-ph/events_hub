<body>
  <header id="top">
    <h1>JNEC Events Hub</h1>

  <main>
    <h2>Get in Touch</h2>
    <p>JNEC Events Hub<br>
    Jigme Namgyel Engineering College<br>
    Dewathang, Samdrup Jongkhar, Bhutan</p>

    <p>Email: <a href="mailto:events@jnec.edu.bt">events@jnec.edu.bt</a></p>
    <p>Phone: +975-77123456</p>

    <h2>Find Us</h2>
    <iframe
      src="https://www.openstreetmap.org/export/embed.html?bbox=91.44,26.85,91.48,26.88"
      width="400" height="250" title="Campus map"></iframe>

    <h2>Send an Enquiry</h2>
    <form action="#" method="post">
      <label for="cname">Name</label>
      <input type="text" id="cname" name="cname">

      <label for="cemail">Email</label>
      <input type="text" id="cemail" name="cemail">

      <label for="cmessage">Message</label>
      <textarea id="cmessage" name="cmessage" rows="4"></textarea>

      <button type="submit">Send</button>
    </form>
  </main>
