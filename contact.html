<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub — Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="top">
    <h1>JNEC Events Hub</h1>
    <nav>
      <a href="index.html" title="Go to home page">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <div class="container py-4">
      <h2 class="mb-4">Get in Touch</h2>

      <div class="card mb-4">
        <div class="card-body">
          <p class="card-text">
            JNEC Events Hub<br>
            Jigme Namgyel Engineering College<br>
            Dewathang, Samdrup Jongkhar, Bhutan
          </p>
          <p class="card-text">
            <i class="fa-solid fa-envelope"></i>
            <a href="mailto:events@jnec.edu.bt">events@jnec.edu.bt</a>
          </p>
          <p class="card-text">
            <i class="fa-solid fa-phone"></i> +975-77123456
          </p>
        </div>
      </div>

      <h2 class="mb-3">Find Us</h2>
      <div class="card mb-4">
        <div class="card-body">
          <iframe
            src="https://www.openstreetmap.org/export/embed.html?bbox=91.44,26.85,91.48,26.88"
            width="100%" height="250" title="Campus map" style="border:0;"></iframe>
        </div>
      </div>

      <h2 class="mb-3">Send an Enquiry</h2>
      <div class="card">
        <div class="card-body">
          <form action="#" method="post">
            <div class="mb-3">
              <label for="cname" class="form-label">Name</label>
              <input type="text" class="form-control" id="cname" name="cname">
            </div>
            <div class="mb-3">
              <label for="cemail" class="form-label">Email</label>
              <input type="text" class="form-control" id="cemail" name="cemail">
            </div>
            <div class="mb-3">
              <label for="cmessage" class="form-label">Message</label>
              <textarea class="form-control" id="cmessage" name="cmessage" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 JNEC Events Hub</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
